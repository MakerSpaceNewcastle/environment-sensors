esphome:
  name: vane-1

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: Maker Space
  password: ""

http_request:

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: Temperature
      on_value:
        then:
          - http_request.post:
              url: "https://environment-sensor:PASSWORD@telemetry.makerspace.org.uk/environment-sensor"
              body: !lambda |-
                return ((std::string) "temperature{node=\"vane-1\"} " + to_string(x) + "\n").c_str();
    humidity:
      name: Humidity
      on_value:
        then:
          - http_request.post:
              url: "https://environment-sensor:PASSWORD@telemetry.makerspace.org.uk/environment-sensor"
              body: !lambda |-
                return ((std::string) "humidity{node=\"vane-1\"} " + to_string(x) + "\n").c_str();
    update_interval: 60s
