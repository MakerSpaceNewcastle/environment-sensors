esphome:
  name: basement-north

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

api:
logger:

wifi:
  ssid: Maker Space
  password: ""

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true

uart:
  id: pm_uart
  tx_pin: GPIO21
  rx_pin: GPIO19
  baud_rate: 9600

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

  - platform: pmsx003
    type: PMSX003
    pm_1_0:
      name: "PM1 Concentration"
    pm_2_5:
      name: "PM2.5 Concentration"
    pm_10_0:
      name: "PM10 Concentration"
    uart_id: pm_uart
    update_interval: 60s
